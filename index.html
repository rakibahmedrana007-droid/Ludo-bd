<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludo BD</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#f5f5f5}
button{padding:12px 18px;margin:5px;border:0;border-radius:8px;cursor:pointer}
.page{display:none}.page.active{display:block}
</style>
</head>
<body>
<h2>Ludo BD</h2>
<div id="home" class="page">
  <h3>Home</h3>
  <button onclick="showPage('deposit')">Deposit</button>
  <button onclick="showPage('withdraw')">Withdraw</button>
</div>
<div id="deposit" class="page">
  <h3>Deposit</h3>
  <p>Deposit page</p>
  <button onclick="showPage('home')">Home</button>
</div>
<div id="withdraw" class="page">
  <h3>Withdraw</h3>
  <p>Withdraw page</p>
  <button onclick="showPage('home')">Home</button>
</div>
<script>
(function(){
  const KEY = 'ludo-bd-current-page';
  function validPage(p){ return ['home','deposit','withdraw'].includes(p); }

  window.showPage = function(page){
    if(!validPage(page)) page='home';
    document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
    const el=document.getElementById(page);
    if(el) el.classList.add('active');
    localStorage.setItem(KEY,page);

    // URL hash keeps the current section after a normal browser refresh.
    if(location.hash !== '#'+page) history.replaceState(null,'','#'+page);
  };

  function restore(){
    const hash = location.hash.replace('#','');
    const saved = localStorage.getItem(KEY);
    showPage(validPage(hash) ? hash : (validPage(saved) ? saved : 'home'));
  }

  window.addEventListener('hashchange', restore);
  window.addEventListener('pageshow', restore);
  restore();
})();
</script>
</body>
</html>
